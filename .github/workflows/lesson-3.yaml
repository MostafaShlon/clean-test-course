name: Lesson 3

on:
  push:
    branches:
      - lesson-3

jobs:
  function_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm install
      - name: Run functional tests
        run: npm test

  deploy:
    needs: [function_test]
    runs-on: ubuntu-latest