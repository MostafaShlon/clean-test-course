name: Lesson 3

on:
  push:
    branches:
      - lesson-3

jobs:
  function_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - name: Run functional tests
        run: CI=true npm test -- --watch=false